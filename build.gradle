plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

// Minecraft version first, then the mod version, e.g. 26.3-1.0.0
version = "${project.minecraft_version}-${project.mod_version}"

repositories {
	maven {
		url = "https://masa.dy.fi/maven/sakura-ryoko"
		content { includeGroupAndSubgroups("fi.dy.masa") }
	}
	// conditional-mixin, a transitive dependency of the masa mods
	maven {
		url = "https://maven.fallenbreath.me/releases"
		content { includeGroupAndSubgroups("me.fallenbreath") }
	}
	// JourneyMap (optional), only published on Modrinth's maven
	maven {
		url = "https://api.modrinth.com/maven"
		content { includeGroup("maven.modrinth") }
	}
}

configurations {
	// The JourneyMap mod jar, only used to take its API out
	journeymapMod { transitive = false }
}

/**
 * Copies a jar nested in a mod jar (META-INF/jars/) to its own file.
 * JourneyMap only publishes the whole mod, with its API nested inside.
 */
abstract class ExtractNestedJar extends DefaultTask {
	@InputFiles
	abstract ConfigurableFileCollection getModJar()

	@Input
	abstract Property<String> getPrefix()

	@OutputFile
	abstract RegularFileProperty getOutput()

	@TaskAction
	void extract() {
		def zip = new java.util.zip.ZipFile(modJar.singleFile)

		try {
			def entry = zip.entries().find { it.name.startsWith("META-INF/jars/" + prefix.get()) && it.name.endsWith(".jar") }

			if (entry == null) {
				throw new GradleException("No nested jar starting with " + prefix.get() + " in " + modJar.singleFile)
			}

			output.get().asFile.parentFile.mkdirs()
			output.get().asFile.bytes = zip.getInputStream(entry).bytes
		}
		finally {
			zip.close()
		}
	}
}

def extractJourneymapApi = tasks.register("extractJourneymapApi", ExtractNestedJar) {
	modJar.from(configurations.journeymapMod)
	prefix = "journeymap-api-"
	output = layout.buildDirectory.file("journeymap-api/journeymap-api.jar")
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"shopping-materialist" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// masa mods (MaLiLib is the shared library required by the others)
	implementation "fi.dy.masa.malilib:malilib-fabric-${project.minecraft_version}:${project.malilib_version}"
	implementation "fi.dy.masa.litematica:litematica-fabric-${project.minecraft_version}:${project.litematica_version}"
	implementation "fi.dy.masa.minihud:minihud-fabric-${project.minecraft_version}:${project.minihud_version}"
	implementation "fi.dy.masa.tweakeroo:tweakeroo-fabric-${project.minecraft_version}:${project.tweakeroo_version}"

	// JourneyMap (optional): only its API is compiled against, the waypoint button checks at runtime whether it's installed
	journeymapMod "maven.modrinth:journeymap:${project.journeymap_version}"
	compileOnly files(extractJourneymapApi)
	// Only in runClient, to test the waypoint button. Not a dependency of the built mod.
	localRuntime "maven.modrinth:journeymap:${project.journeymap_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
